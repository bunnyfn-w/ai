<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navi AI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts & Ikonok -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #131314; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-gray-200 h-screen flex">

    <!-- Oldalsáv (Sidebar) -->
    <div class="w-68 bg-[#1e1e20] h-full p-4 flex flex-col justify-between hidden md:flex">
        <div class="flex flex-col gap-4">
            <button onclick="clearChat()" class="flex items-center gap-3 px-4 py-3 bg-[#1a1a1c] hover:bg-[#282a2c] rounded-full text-sm font-medium text-gray-300 transition-all w-fit">
                <span class="material-symbols-rounded text-sm">add</span>
                Új csevegés
            </button>
        </div>
        
        <div class="flex flex-col gap-2 text-sm text-gray-400 p-2">
            <div class="flex items-center gap-3 p-2 hover:bg-[#282a2c] rounded-lg cursor-pointer">
                <span class="material-symbols-rounded">help</span> Súgó
            </div>
            <div class="flex items-center gap-3 p-2 hover:bg-[#282a2c] rounded-lg cursor-pointer">
                <span class="material-symbols-rounded">history</span> Tevékenység
            </div>
            <div class="flex items-center gap-3 p-2 hover:bg-[#282a2c] rounded-lg cursor-pointer">
                <span class="material-symbols-rounded">settings</span> Beállítások
            </div>
        </div>
    </div>

    <!-- Fő csevegő felület -->
    <div class="flex-1 flex flex-col h-full relative">
        
        <!-- Fejléc -->
        <div class="flex items-center justify-between p-4 bg-[#131314]">
            <div class="flex items-center gap-2">
                <span class="text-xl font-medium bg-gradient-to-r from-blue-400 via-purple-400 to-pink-400 bg-clip-text text-transparent">Gemini AI</span>
                <span class="text-xs bg-[#1e1e20] text-gray-400 px-2 py-0.5 rounded">Biztonságos Szerver Csatorna</span>
            </div>
            <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-blue-500 to-purple-500 flex items-center justify-center text-xs font-bold text-white">
                USER
            </div>
        </div>

        <!-- Üzenetek listája -->
        <div id="chat-container" class="flex-1 overflow-y-auto no-scrollbar px-4 py-6 md:px-24 flex flex-col gap-6 pb-32">
            <!-- Üdvözlő képernyő -->
            <div id="welcome-screen" class="flex flex-col items-center justify-center h-full my-auto text-center gap-4">
                <h1 class="text-4xl md:text-5xl font-medium bg-gradient-to-r from-blue-400 via-purple-400 to-pink-500 bg-clip-text text-transparent py-2">
                    Szia! Miben segíthetek ma?
                </h1>
                <p class="text-gray-400 text-sm max-w-md">A szerveroldali hívás emuláció kész. Írj be egy üzenetet a csevegés elindításához!</p>
            </div>
        </div>

        <!-- Alsó beviteli mező -->
        <div class="absolute bottom-0 left-0 w-full bg-gradient-to-t from-[#131314] via-[#131314] to-transparent px-4 py-6 md:px-24">
            <div class="max-w-3xl mx-auto bg-[#1e1e20] rounded-3xl p-2 flex flex-col gap-2 focus-within:bg-[#282a2c] transition-all border border-transparent focus-within:border-gray-700">
                <div class="flex items-end gap-2 px-2">
                    <textarea id="user-input" rows="1" placeholder="Kérdezz valamit az AI-tól..." class="flex-1 bg-transparent resize-none outline-none text-gray-200 placeholder-gray-500 py-2 max-h-40 text-base" oninput="autoGrow(this)"></textarea>
                    
                    <button onclick="sendMessage()" class="p-2 bg-transparent hover:bg-[#131314] rounded-full text-blue-400 hover:text-blue-300 transition-all flex items-center justify-center">
                        <span class="material-symbols-rounded">send</span>
                    </button>
                </div>
            </div>
            <p class="text-center text-xs text-gray-500 mt-2">Szerver emuláció bekapcsolva az Nvidia API-hoz.</p>
        </div>
    </div>

    <!-- JavaScript logikák -->
    <script>
        // Az API kulcsod biztonságosan beágyazva
        const NVIDIA_API_KEY = "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"; 
        
        // Új, stabilabb szerveroldali emulációs proxy URL
        const API_URL = "https://api.allorigins.win/get?url=" + encodeURIComponent("https://integrate.api.nvidia.com/v1/chat/completions");

        // Nvidia Llama 3 alapmodell
        const MODEL_NAME = "meta/llama3-8b-instruct"; 

        const chatContainer = document.getElementById('chat-container');
        const welcomeScreen = document.getElementById('welcome-screen');
        const userInput = document.getElementById('user-input');

        function autoGrow(element) {
            element.style.height = "5px";
            element.style.height = (element.style.scrollHeight) + "px";
        }

        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function appendMessage(sender, text) {
            if (welcomeScreen) welcomeScreen.style.display = 'none';

            const msgDiv = document.createElement('div');
            msgDiv.className = `flex gap-4 max-w-3xl w-full mx-auto ${sender === 'user' ? 'justify-end' : 'justify-start'}`;

            const innerHtml = sender === 'user' 
                ? `
                    <div class="bg-[#282a2c] text-gray-200 px-4 py-2.5 rounded-2xl max-w-[85%] inline-block text-base shadow-sm">
                        ${text.replace(/\n/g, '<br>')}
                    </div>
                `
                : `
                    <div class="w-7 h-7 rounded-full bg-gradient-to-r from-blue-500 to-purple-500 flex items-center justify-center text-xs flex-shrink-0 mt-1 font-bold text-white shadow-sm">AI</div>
                    <div class="flex-1 text-gray-200 text-base leading-relaxed pt-1 markdown-body">
                        ${text}
                    </div>
                `;

            msgDiv.innerHTML = innerHtml;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return msgDiv;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage('user', text);
            userInput.value = '';
            userInput.style.height = 'auto';

            const loadingMsg = appendMessage('ai', '<span class="text-gray-400 animate-pulse">Gondolkodom...</span>');

            try {
                // Elküldjük a kérést az allorigins álcázott csatornán keresztül
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: JSON.stringify({
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${NVIDIA_API_KEY}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            model: MODEL_NAME,
                            messages: [{ role: "user", content: text }],
                            temperature: 0.5,
                            max_tokens: 1024
                        })
                    })
                });

                if (!response.ok) {
                    throw new Error(`Átviteli hiba történt (${response.status})`);
                }

                const outerData = await response.json();
                
                // Az allorigins egy stringként adja vissza az Nvidia belső válaszát, ezt be kell parsolni
                const data = JSON.parse(outerData.contents);

                if (data.detail || data.message || !data.choices) {
                    const errMsg = data.detail || data.message || JSON.stringify(data);
                    throw new Error(`Nvidia Szerver Hiba: ${errMsg}`);
                }

                const aiReply = data.choices[0].message.content;
                loadingMsg.querySelector('.markdown-body').innerHTML = aiReply.replace(/\n/g, '<br>');

            } catch (error) {
                console.error("Hiba részletei:", error);
                loadingMsg.querySelector('.markdown-body').innerHTML = `
                    <div class="p-3 bg-red-950/40 border border-red-900/50 rounded-xl text-red-300 text-sm flex flex-col gap-1">
                        <span class="font-semibold flex items-center gap-1"><span class="material-symbols-rounded text-base">error</span> Rendszer hiba</span>
                        <span>${error.message}</span>
                        <span class="text-xs text-red-400/70 mt-2">💡 Ha továbbra sem működik, az azt jelenti, hogy az Nvidia kulcsodnak nincs jogosultsága ehhez a specifikus modellhez (meta/llama3-8b-instruct), vagy elfogytak az ingyenes kreditek az Nvidia Build fiókodon.</span>
                    </div>
                `;
            }
            
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function clearChat() {
            chatContainer.innerHTML = '';
            chatContainer.appendChild(welcomeScreen);
            welcomeScreen.style.display = 'flex';
        }
    </script>
</body>
</html>
