<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navi AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #131314; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="text-gray-200 h-screen flex">

    <!-- Oldalsáv -->
    <div class="w-68 bg-[#1e1e20] h-full p-4 flex flex-col justify-between hidden md:flex">
        <div class="flex flex-col gap-4">
            <button onclick="clearChat()" class="flex items-center gap-3 px-4 py-3 bg-[#1a1a1c] hover:bg-[#282a2c] rounded-full text-sm font-medium text-gray-300 transition-all w-fit">
                <span class="material-symbols-rounded text-sm">add</span>
                Új csevegés
            </button>
        </div>
        <div class="flex flex-col gap-2 text-sm text-gray-400 p-2">
            <div class="flex items-center gap-3 p-2 hover:bg-[#282a2c] rounded-lg cursor-pointer">
                <span class="material-symbols-rounded">help</span> Súgó
            </div>
            <div class="flex items-center gap-3 p-2 hover:bg-[#282a2c] rounded-lg cursor-pointer">
                <span class="material-symbols-rounded">history</span> Tevékenység
            </div>
            <div class="flex items-center gap-3 p-2 hover:bg-[#282a2c] rounded-lg cursor-pointer">
                <span class="material-symbols-rounded">settings</span> Beállítások
            </div>
        </div>
    </div>

    <!-- Fő csevegő felület -->
    <div class="flex-1 flex flex-col h-full relative">

        <!-- Fejléc -->
        <div class="flex items-center justify-between p-4 bg-[#131314]">
            <div class="flex items-center gap-2">
                <span class="text-xl font-medium bg-gradient-to-r from-blue-400 via-purple-400 to-pink-400 bg-clip-text text-transparent">Navi AI</span>
                <span class="text-xs bg-[#1e1e20] text-gray-400 px-2 py-0.5 rounded">Google AI API</span>
            </div>
            <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-blue-500 to-purple-500 flex items-center justify-center text-xs font-bold text-white">
                USER
            </div>
        </div>

        <!-- Üzenetek listája -->
        <div id="chat-container" class="flex-1 overflow-y-auto no-scrollbar px-4 py-6 md:px-24 flex flex-col gap-6 pb-32">
            <div id="welcome-screen" class="flex flex-col items-center justify-center h-full my-auto text-center gap-4">
                <h1 class="text-4xl md:text-5xl font-medium bg-gradient-to-r from-blue-400 via-purple-400 to-pink-500 bg-clip-text text-transparent py-2">
                    Szia! Miben segíthetek ma?
                </h1>
                <p class="text-gray-400 text-sm max-w-md">Írj be egy üzenetet a csevegés elindításához!</p>
            </div>
        </div>

        <!-- Alsó beviteli mező -->
        <div class="absolute bottom-0 left-0 w-full bg-gradient-to-t from-[#131314] via-[#131314] to-transparent px-4 py-6 md:px-24">
            <div class="max-w-3xl mx-auto bg-[#1e1e20] rounded-3xl p-2 flex flex-col gap-2 focus-within:bg-[#282a2c] transition-all border border-transparent focus-within:border-gray-700">
                <div class="flex items-end gap-2 px-2">
                    <textarea id="user-input" rows="1" placeholder="Kérdezz valamit az AI-tól..." class="flex-1 bg-transparent resize-none outline-none text-gray-200 placeholder-gray-500 py-2 max-h-40 text-base"></textarea>
                    <button onclick="sendMessage()" id="send-btn" class="p-2 bg-transparent hover:bg-[#131314] rounded-full text-blue-400 hover:text-blue-300 transition-all flex items-center justify-center">
                        <span class="material-symbols-rounded">send</span>
                    </button>
                </div>
            </div>
            <p class="text-center text-xs text-gray-500 mt-2">Google Gemini · gemini-1.5-flash</p>
        </div>
    </div>

    <!-- Google Generative AI SDK importálása -->
    <script type="importmap">
      {
        "imports": {
          "@google/generative-ai": "https://esm.run/@google/generative-ai"
        }
      }
    </script>

    <script type="module">
        import { GoogleGenAI } from "@google/generative-ai";

        // ⚠️ IDE ÍRD BE A GOOGLE AI API KULCSODAT:
        const GOOGLE_API_KEY = "AIzaSyCgRuktoJ4Ign_pGbdodzeWSSdpvM5chdc";

        // Az SDK inicializálása
        const ai = new GoogleGenAI({ apiKey: GOOGLE_API_KEY });
        // Beállítjuk a modellt (a gemini-1.5-flash rendkívül gyors és tökéletes csevegésre)
        const model = ai.getGenerativeModel({ model: "gemini-1.5-flash" });

        const chatContainer = document.getElementById('chat-container');
        const welcomeScreen = document.getElementById('welcome-screen');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        function autoGrow(element) {
            element.style.height = "auto";
            element.style.height = element.scrollHeight + "px";
        }

        userInput.addEventListener('input', () => autoGrow(userInput));

        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function appendMessage(sender, text) {
            if (welcomeScreen) welcomeScreen.style.display = 'none';

            const msgDiv = document.createElement('div');
            msgDiv.className = `flex gap-4 max-w-3xl w-full mx-auto ${sender === 'user' ? 'justify-end' : 'justify-start'}`;

            msgDiv.innerHTML = sender === 'user'
                ? `<div class="bg-[#282a2c] text-gray-200 px-4 py-2.5 rounded-2xl max-w-[85%] inline-block text-base shadow-sm">${text.replace(/\n/g, '<br>')}</div>`
                : `<div class="w-7 h-7 rounded-full bg-gradient-to-r from-blue-500 to-purple-500 flex items-center justify-center text-xs flex-shrink-0 mt-1 font-bold text-white shadow-sm">AI</div>
                   <div class="flex-1 text-gray-200 text-base leading-relaxed pt-1 markdown-body">${text}</div>`;

            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return msgDiv;
        }

        function setLoading(isLoading) {
            sendBtn.disabled = isLoading;
            userInput.disabled = isLoading;
            sendBtn.innerHTML = isLoading
                ? `<span class="material-symbols-rounded animate-spin">progress_activity</span>`
                : `<span class="material-symbols-rounded">send</span>`;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text || sendBtn.disabled) return;

            appendMessage('user', text);
            userInput.value = '';
            userInput.style.height = 'auto';
            setLoading(true);

            const loadingMsg = appendMessage('ai', '<span class="text-gray-400 animate-pulse">Gondolkodom...</span>');

            try {
                // A kérés elküldése a Google Gemini API-nak
                const result = await model.generateContent(text);
                const response = await result.response;
                const aiReply = response.text();

                // Formázás: sortörések cseréje <br>-re a markdown-body-n belül
                loadingMsg.querySelector('.markdown-body').innerHTML = aiReply.replace(/\n/g, '<br>');

            } catch (error) {
                console.error("Hiba részletei:", error);
                loadingMsg.querySelector('.markdown-body').innerHTML = `
                    <div class="p-3 bg-red-950/40 border border-red-900/50 rounded-xl text-red-300 text-sm flex flex-col gap-1">
                        <span class="font-semibold flex items-center gap-1">
                            <span class="material-symbols-rounded text-base">error</span> Hiba történt
                        </span>
                        <span>${error.message}</span>
                        <span class="text-xs text-red-400/70 mt-2">
                            💡 Ellenőrizd, hogy a Google AI API kulcsod érvényes-e, és nem korlátozza-e valamilyen hálózati hiba.
                        </span>
                    </div>`;
            } finally {
                setLoading(false);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        }

        // Globálissá tesszük a törlés funkciót a gomb számára
        window.clearChat = function() {
            chatContainer.innerHTML = '';
            chatContainer.appendChild(welcomeScreen);
            welcomeScreen.style.display = 'flex';
        }
        
        // Globálissá tesszük a küldést is, hogy a HTML gomb elérje
        window.sendMessage = sendMessage;
    </script>
</body>
</html>
